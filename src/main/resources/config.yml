# LouiPlugin — config
void:
  # Mundo do vazio (vazio = mundo principal)
  world: ''
  # Coordenadas afastadas pra ninguem ver/achar
  x: 250000.5
  z: 250000.5
  # Altura inicial da queda e altura minima (ao chegar nela, teleporta de volta pro topo)
  top-y: 5000.0
  min-y: 1500.0
  # Cada preso ocupa uma faixa de altura propria, pra dois presos simultaneos nao
  # ocuparem o mesmo ponto. A altura de queda de cada faixa e (top-y - min-y).
  band-gap: 100.0
  max-bands: 8

bossbar:
  # Cores: RED, BLUE, GREEN, PINK, PURPLE, WHITE, YELLOW
  color: RED

messages:
  prefix: '&8[&cLoui&8] &7'
  jailed-target: '&cVoce foi contido pelo motivo: &f%reason% &7(%time%)'
  jailed-broadcast-staff: '&7%player% foi contido por %time%: &f%reason%'
  released: '&aVoce foi libertado. Comporte-se.'
  no-commands: '&cVoce nao pode usar comandos enquanto estiver contido.'
  not-jailed: '&cEsse jogador nao esta contido.'
  already-free: '&aJogador libertado.'
  usage: '&7Uso: /loui <nick> <tempo: 30m, 2h ou 2d> <motivo...> | /loui free <nick> | /loui list'
  is-exempt: '&cEsse jogador e imune ao castigo.'
  never-joined: '&cEsse jogador nunca entrou no servidor.'
  exempt-discarded: '&7%player% e imune ao castigo — punicao descartada.'
  imprison-vetoed: '&cA punicao foi impedida por outro plugin.'

safety:
  # Solta todos os presos ONLINE quando o plugin e desabilitado. Sem isso, remover
  # o plugin deixa o jogador cego e invulneravel no vazio, sem comando que resolva.
  # Presos OFFLINE nao sao alcancados — solte-os com /loui free antes de desinstalar.
  release-all-on-disable: true

notify:
  # Quem recebe o aviso quando alguem e contido.
  permission: loui.notify

restrictions:
  # Comandos que o preso ainda pode usar — util pra dar um canal de recurso.
  # Vazio bloqueia tudo, que e o comportamento padrao.
  # Aliases nao sao resolvidos: liberar /msg nao libera /tell.
  allowed-commands: []
