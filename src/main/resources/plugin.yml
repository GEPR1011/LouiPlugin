name: LouiPlugin
version: 1.2.0
main: com.nemonicorp.loui.LouiPlugin
api-version: '1.21'
description: Castigo void para conter jogadores mal intencionados.
author: GEPR
softdepend: [PlaceholderAPI]
commands:
  loui:
    description: Envia um jogador pro vazio por um tempo determinado.
    usage: |
      /loui <nick> <tempo: 30m, 2h ou 2d> <motivo...>
      /loui free <nick>
      /loui list
    permission: loui.use

permissions:
  loui.use:
    description: Permite usar o /loui.
    default: op
  loui.exempt:
    description: Torna o jogador imune ao castigo.
    default: false
  loui.notify:
    description: Recebe aviso quando alguem e contido.
    default: op
